[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xvc2-large-streaming-student"
version = "0.1.0"
description = "Large limited-lookahead phone encoder for X-VC2"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.44,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
xvc2-student-audit = "xvc2_student.audit:main"
xvc2-student-benchmark = "xvc2_student.benchmark:main"
xvc2-student-env-check = "xvc2_student.env_check:main"
xvc2-student-inspect-libriheavy = "xvc2_student.inspect_libriheavy:main"
xvc2-student-inspect-corpora = "xvc2_student.inspect_audio_corpora:main"
xvc2-student-train = "xvc2_student.train:main"
xvc2-student-smoke = "xvc2_student.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
