schema_version: 1
model:
  conv_dim: [512, 512, 512, 512, 512, 512, 512]
  conv_kernel: [10, 3, 3, 3, 3, 2, 2]
  conv_stride: [5, 2, 2, 2, 2, 2, 2]
  conv_bias: true
  feat_extract_norm: layer
  feat_extract_activation: gelu
  model_dim: 768
  num_heads: 12
  ffn_dim: 3072
  num_layers: 12
  segment_length: 4
  left_context_length: 32
  right_context_length: 2
  dropout: 0.1
  teacher_dim: 1024
  vocab_size: 40
  freeze_feature_extractor: true
distillation:
  teacher_layer: 20
  feature_weight: 1.0
  ctc_weight: 0.1
  streaming_consistency_weight: 0.0
  anchor_weight: 0.0
  anchor_checkpoint: null
training:
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 200000
  gradient_clip: 1.0
  amp: bf16
  seed: 1
  log_interval: 20
  save_interval: 5000

